services:
  db:
    image: postgres:15-alpine
    container_name: mt_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mt_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
